[pytest]
testpaths = tests e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: smoke tests (service reachable, health, docs)
    auth: authentication and authorization
    crud: create/read/update/delete flows
    negative: invalid input / error paths
    boundary: boundary values and edge cases
    e2e: real-browser end-to-end flows (Playwright)
    security: security probing (auth, IDOR, injection, XSS, config)
addopts = -ra -q
