[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=html:test_reports/coverage_html
    --cov-report=term-missing
    --cov-report=json:test_reports/coverage.json
    --cov-report=xml:test_reports/coverage.xml
    --cov-fail-under=80
    --junit-xml=test_reports/junit.xml
    --maxfail=10
    --timeout=300
    --durations=10
    --durations-min=1.0
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    api: API endpoint tests
    performance: Performance and load tests
    security: Security and authentication tests
    slow: Slow running tests (>5 seconds)
    meeting: Meeting module specific tests
    webrtc: WebRTC functionality tests
    recording: Recording functionality tests
    ai: AI service tests
    database: Database operation tests
    redis: Redis cache tests
    mock: Tests using mocked dependencies
    real: Tests using real services
    framework: Test framework validation tests
    cleanup: Tests that require data cleanup
    smoke: Smoke tests for basic functionality
    regression: Regression tests for bug fixes
    load: Load testing for high volume scenarios
    stress: Stress testing for system limits
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::RuntimeWarning
    ignore::UserWarning
    ignore::sqlalchemy.exc.SAWarning
asyncio_mode = auto
timeout = 300
timeout_method = thread
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = test_reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S