apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-backend
  namespace: production
  labels:
    app: ai-testing-system
    component: backend
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-west-2:123456789012:certificate/12345678-1234-1234-1234-123456789012"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: ai-testing-system
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-frontend
  namespace: production
  labels:
    app: ai-testing-system
    component: frontend
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-west-2:123456789012:certificate/12345678-1234-1234-1234-123456789012"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 3000
    protocol: TCP
    name: https
  selector:
    app: ai-testing-system
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-internal
  namespace: production
  labels:
    app: ai-testing-system
    environment: production
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: backend
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: frontend
  selector:
    app: ai-testing-system
    environment: production

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-testing-system-ingress
  namespace: production
  labels:
    app: ai-testing-system
    environment: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - ai-testing-system.com
    - api.ai-testing-system.com
    secretName: ai-testing-system-tls
  rules:
  - host: ai-testing-system.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-testing-system-frontend
            port:
              number: 80
  - host: api.ai-testing-system.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-testing-system-backend
            port:
              number: 80