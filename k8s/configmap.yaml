apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-test-management
data:
  APP_NAME: "AI Test Management System"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  MAX_FILE_SIZE: "100MB"
  UPLOAD_PATH: "/app/uploads"
  CORS_ORIGINS: "https://yourdomain.com"
  VITE_API_BASE_URL: "https://api.yourdomain.com"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ai-test-management
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    timeout 300
    tcp-keepalive 60
    daemonize no
    supervised no
    loglevel notice
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec