apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-backend
  namespace: staging
  labels:
    app: ai-testing-system
    component: backend
    environment: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: ai-testing-system
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-frontend
  namespace: staging
  labels:
    app: ai-testing-system
    component: frontend
    environment: staging
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 3000
    protocol: TCP
    name: https
  selector:
    app: ai-testing-system
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: ai-testing-system-internal
  namespace: staging
  labels:
    app: ai-testing-system
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: backend
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: frontend
  selector:
    app: ai-testing-system
    environment: staging