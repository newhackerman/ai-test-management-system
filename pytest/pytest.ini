[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -p no:cacheprovider
    --strict-markers    
    --reruns=3
    --reruns-delay=5
    --timeout=15
aitms_allure_timestamp_format = yyyyMMdd_HHmmss
aitms_allure_results_template = reports/allure-results/{timestamp}
aitms_allure_report_template = reports/allure-report/{timestamp}
markers =
    api: FastAPI in-process API tests
    business_crud: Closed-loop business create/read/update/delete tests
    contract: OpenAPI and routing contract tests
    coverage: Endpoint coverage matrix tests
    e2e: End-to-end tests that require a running frontend/backend
    endpoint_matrix: One pytest case per OpenAPI operation
    frontend: Frontend configuration and source checks
    live: Tests that require a running HTTP service
    regression: Regression tests for broader non-smoke coverage
    security: Security baseline tests
    smoke: Fast smoke tests
    structure: Repository structure and static checks
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
