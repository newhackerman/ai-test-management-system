# redis-server.service 在本机 VM 上因 PrivateUsers=true 报 217/USER：
# systemd 建用户命名空间失败（"Failed to set up user namespacing:
# No such file or directory"），与 redis 用户是否存在无关——一个
# User=redis 的普通单元可以正常启动。本 override 只关掉用户命名
# 空间，其余沙箱（ProtectSystem / PrivateTmp / NoNewPrivileges）
# 保持原样。/etc 不随虚拟机替换持久化，由 ops/recover.sh 在每次
# 运行时安装（见 ensure_redis_unit_override）。
[Service]
PrivateUsers=false
